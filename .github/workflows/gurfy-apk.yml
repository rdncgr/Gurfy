name: Gurfy APK Derle

# Gurfy (sunucusuz) ya da ortak arayüz (shared/) değişince çalışır. Gurfy Sync'in derlemesi apk.yml'de.
on:
  push:
    branches: [main]
    paths:
      - "gurfy/**"
      - "shared/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/gurfy-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Gurfy Sync ile aynı imza anahtarı (depo kökünde keystore/ klasörüne yerleşir)
      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | sed 's/-----[A-Z ]*-----//g' | tr -d '[:space:]' > keystore.b64
          if ! base64 -d keystore.b64 > keystore/debug.keystore; then
            echo "::error::KEYSTORE_BASE64 çözülemedi"; exit 1
          fi

      # Sürüm gurfy/surum.txt dosyasından. Bu sürüm daha önce yayınlandıysa yalnızca derlenir, yeni sürüm çıkmaz.
      - name: Sürümü oku
        id: v
        run: |
          V=$(tr -d '[:space:]' < gurfy/surum.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/gurfy-v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Gurfy $V zaten yayınlanmış. Yeni sürüm için gurfy/surum.txt artırılmalı."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        run: gradle :gurfy:assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp gurfy/app/build/outputs/apk/release/gurfy-release.apk gurfy-${{ steps.v.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gurfy-apk
          path: gurfy-${{ steps.v.outputs.version }}.apk

      # Etiketler "gurfy-v" ile başlar ("gurfy-sync-v" Gurfy Sync'in); uygulama güncellemeyi buradan bulur
      - name: Sürüm olarak yayınla
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gurfy-v${{ steps.v.outputs.version }}
          name: Gurfy ${{ steps.v.outputs.version }}
          make_latest: false
          files: gurfy-${{ steps.v.outputs.version }}.apk
