name: APK Derle

on:
  push:
    branches: [main]
    # Yalnızca Gurfy'ye (sunucusuz uygulama) ait değişiklikler Gurfy Sync sürümü çıkarmasın: o, gurfy-apk.yml'de derlenir.
    # Ortak arayüz (shared/) değişince iki uygulama da derlenir.
    paths-ignore:
      - "gurfy/**"
      - ".github/workflows/gurfy-apk.yml"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # İmza anahtarı depoda değil: Settings > Secrets > Actions > KEYSTORE_BASE64
      # (keystore/debug.keystore dosyasının base64 hali). Aynı anahtar olmazsa güncelleme eskisinin üzerine kurulmaz.
      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          mkdir -p keystore
          # Boşluk, satır sonu ve certutil'in BEGIN/END satırları temizlenir
          printf '%s' "$KEYSTORE_BASE64" | sed 's/-----[A-Z ]*-----//g' | tr -d '[:space:]' > keystore.b64
          if ! base64 -d keystore.b64 > keystore/debug.keystore; then
            echo "::error::KEYSTORE_BASE64 çözülemedi: değer base64 değil, yanlış yapıştırılmış olabilir"; exit 1
          fi
          if ! keytool -list -keystore keystore/debug.keystore -storepass android >/dev/null; then
            echo "::error::KEYSTORE_BASE64 geçerli bir imza anahtarı değil"; exit 1
          fi

      # Sürüm app/surum.txt dosyasından. Bu sürüm daha önce yayınlandıysa yalnızca derlenir, yeni sürüm çıkmaz.
      - name: Sürümü oku
        id: v
        run: |
          V=$(tr -d '[:space:]' < app/surum.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/gurfy-sync-v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Gurfy Sync $V zaten yayınlanmış. Yeni sürüm için app/surum.txt artırılmalı."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk gurfy-sync-${{ steps.v.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gurfy-sync-apk
          path: gurfy-sync-${{ steps.v.outputs.version }}.apk

      # Uygulamalar güncellemeyi "gurfy-sync-v" etiketlerinden bulur (shared/.../Updates.kt)
      - name: Sürüm olarak yayınla
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gurfy-sync-v${{ steps.v.outputs.version }}
          name: Gurfy Sync ${{ steps.v.outputs.version }}
          files: gurfy-sync-${{ steps.v.outputs.version }}.apk
