name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # İmza anahtarı depoda değil: Settings > Secrets > Actions > KEYSTORE_BASE64
      # (keystore/debug.keystore dosyasının base64 hali). Aynı anahtar olmazsa güncelleme eskisinin üzerine kurulmaz.
      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          mkdir -p keystore
          # Boşluk, satır sonu ve certutil'in BEGIN/END satırları temizlenir
          printf '%s' "$KEYSTORE_BASE64" | sed 's/-----[A-Z ]*-----//g' | tr -d '[:space:]' > keystore.b64
          if ! base64 -d keystore.b64 > keystore/debug.keystore; then
            echo "::error::KEYSTORE_BASE64 çözülemedi: değer base64 değil, yanlış yapıştırılmış olabilir"; exit 1
          fi
          if ! keytool -list -keystore keystore/debug.keystore -storepass android >/dev/null; then
            echo "::error::KEYSTORE_BASE64 geçerli bir imza anahtarı değil"; exit 1
          fi

      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk gurfy-sync-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gurfy-sync-apk
          path: gurfy-sync-${{ github.run_number }}.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Gurfy Sync ${{ github.run_number }}
          files: gurfy-sync-${{ github.run_number }}.apk
