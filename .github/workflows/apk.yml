name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # İmza anahtarı depoda değil: Settings > Secrets > Actions > KEYSTORE_BASE64
      # (keystore/debug.keystore dosyasının base64 hali). Aynı anahtar olmazsa güncelleme eskisinin üzerine kurulmaz.
      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret tanımlı değil"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk nota-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nota-apk
          path: nota-${{ github.run_number }}.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Nota ${{ github.run_number }}
          files: nota-${{ github.run_number }}.apk
